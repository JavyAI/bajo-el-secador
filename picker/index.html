<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1a1612">
  <title>Elige la placa — En el secador</title>
  <link rel="icon" href="../favicon.ico?v=33" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="../assets/icons/favicon-32.png?v=33">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="picker.css">
</head>
<body>
  <header class="top">
    <p class="top__kicker">Codex · 16 agosto</p>
    <h1>Elige la placa</h1>
    <p class="top__lede">One image per room. The gold ring is what’s on the listening site now. Click the plate you want. Lock all six when you’re ready and I’ll wire them.</p>
    <nav class="chips" id="chips" aria-label="Salas"></nav>
  </header>

  <main id="rooms"></main>

  <aside class="dock" id="dock" aria-label="Tus seis">
    <div class="dock__picks" id="picks"></div>
    <button type="button" class="dock__lock" id="lock" disabled>Lock in <span id="lock-count">0</span>/6</button>
    <p class="dock__status" id="status" hidden></p>
  </aside>

  <dialog class="lightbox" id="lightbox">
    <img id="lightbox-img" alt="">
    <form method="dialog"><button type="submit">Cerrar</button></form>
  </dialog>

  <script src="picker.js"></script>
</body>
</html>
