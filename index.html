  <script>
    if (location.hostname === "127.0.0.1") {
      location.replace("http://localhost:" + (location.port || "80") + location.pathname + location.search + location.hash);
    }
    (function () {
      var THEMES = {
        colmado: { ayer: "#b8750c", hoy: "#2a1e06" },
        secador: { ayer: "#ae4e2a", hoy: "#12122a" },
        barberia: { ayer: "#c42818", hoy: "#8a1e12" },
        limpieza: { ayer: "#0a7382", hoy: "#1a3a40" },
        galeria: { ayer: "#1f7045", hoy: "#1e4e5a" },
        malecon: { ayer: "#0e5f96", hoy: "#061e42" }
      };
      var ALIAS = { salon: "secador", rolos: "secador", esquina: "colmado", silla: "barberia", deluxe: "barberia", "salon-deluxe": "barberia", vitilla: "colmado", marquesina: "limpieza", cibao: "galeria", campo: "galeria" };
      var id = (location.hash || "#colmado").replace(/^#/, "").split(/[/?]/)[0];
      if (ALIAS[id]) id = ALIAS[id];
      var era = /(?:\?|&)hoy=1(?:&|$)/.test(location.search) ? "hoy" : "ayer";
      var room = THEMES[id] || THEMES.colmado;
      var color = room[era];
      document.documentElement.style.setProperty("--theme", color);
      document.documentElement.style.backgroundColor = color;
      document.documentElement.style.colorScheme = era === "hoy" ? "dark" : "light";
      document.querySelectorAll('meta[name="theme-color"], meta[name="msapplication-TileColor"], meta[name="msapplication-navbutton-color"]').forEach(function (node) {
        node.setAttribute("content", color);
      });
      var scheme = document.querySelector('meta[name="color-scheme"]');
      if (scheme) scheme.setAttribute("content", era === "hoy" ? "dark" : "light");
      window.__SOPITA_THEME = { id: id, era: era, color: color };
    })();
  </script>
