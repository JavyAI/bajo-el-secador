      location.replace("http://localhost:" + (location.port || "80") + location.pathname + location.search + location.hash);

  <link rel="icon" href="favicon.ico" sizes="any">

</head>
<body data-room="salon">
  <div class="hero-stack" aria-hidden="true">
    <div class="hero is-on" id="hero-a" data-scene="salon"></div>
    <div class="hero" id="hero-b"></div>
    <div class="hero__veil"></div>
  </div>

  <div id="yt-host" aria-hidden="true">
    <div id="yt-player-a"></div>
    <div id="yt-player-b"></div>
  </div>

  <div class="clock" id="clock" aria-live="off">
    <p class="clock__hi" id="clock-hi"></p>
    <p class="clock__time" id="clock-time"></p>
    <p class="clock__date" id="clock-date"></p>
  </div>

  <div class="presence" aria-live="polite">
    <span class="presence__dot" aria-hidden="true"></span>
    <span class="presence__n" id="online">1</span>
    <span class="presence__label">online</span>
  </div>

  <div class="links">
    <a class="pill" id="lista-link" href="https://music.youtube.com/playlist?list=PLHGerkzq-_SQ" target="_blank" rel="noopener noreferrer" aria-label="Abrir en YouTube Music">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
        <path d="M12 0C5.376 0 0 5.376 0 12s5.376 12 12 12 12-5.376 12-12S18.624 0 12 0zm0 19.104c-3.924 0-7.104-3.18-7.104-7.104S8.076 4.896 12 4.896s7.104 3.18 7.104 7.104-3.18 7.104-7.104 7.104zm0-13.332c-3.432 0-6.228 2.796-6.228 6.228S8.568 18.228 12 18.228s6.228-2.796 6.228-6.228S15.432 5.772 12 5.772zM9.684 15.54V8.46L15.816 12l-6.132 3.54z"/>
      </svg>
      <span class="pill__label">YT Music</span>
      <span class="pill__go" aria-hidden="true">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M5 12h14M13 6l6 6-6 6"/>
        </svg>
      </span>
    </a>
  </div>

  <main class="center">
    <p class="kicker" id="kicker">Baladas y merengue</p>
    <h1 class="wordmark" id="wordmark"><span>Bajo el</span><span>secador</span></h1>
    <nav class="rooms" aria-label="Salas">
      <a href="#salon" data-room="salon" class="is-on">Secador</a>
      <a href="#barberia" data-room="barberia">Silla</a>
      <a href="#colmado" data-room="colmado">Esquina</a>
    </nav>
  </main>

  <footer class="dock">
    <div class="player">
      <div class="vinyl" id="vinyl">
        <img class="cover" id="cover" src="https://i.ytimg.com/vi/gr6RzMi4L3o/mqdefault.jpg" alt="" width="80" height="80">
      </div>
      <div class="meta">
        <a class="title" id="title" href="https://www.youtube.com/watch?v=RgKqxLAhRKE" target="_blank" rel="noopener noreferrer">Amor Eterno</a>
        <p class="artist" id="artist">Juan Gabriel</p>
        <div class="seek-wrap">
          <input type="range" id="seek" class="seek" min="0" max="1000" value="0" step="1" aria-label="Tiempo" disabled>
          <p class="times"><span id="elapsed">0:00</span> / <span id="duration">0:00</span></p>
        </div>
      </div>
      <div class="controls">
        <button type="button" id="btn-prev" class="icon-btn" aria-label="Anterior">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M6 6h2v12H6zm3.5 6 8.5 6V6z"/></svg>
        </button>
        <button type="button" id="btn-play" class="play" aria-label="Reproducir">
          <svg class="ico-play" width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg>
          <svg class="ico-pause" width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M6 5h4v14H6zm8 0h4v14h-4z"/></svg>
        </button>
        <button type="button" id="btn-next" class="icon-btn" aria-label="Siguiente">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M16 6h2v12h-2zm-2 6L5.5 6v12z"/></svg>
        </button>
      </div>
    </div>
    <p class="sr-only" id="status" aria-live="polite"></p>
  </footer>

  <aside id="dbg" class="dbg" hidden>
    <header class="dbg__bar">
      <span>radio</span>
      <button type="button" id="dbg-close" class="dbg__x" aria-label="Cerrar debug">×</button>
    </header>
    <pre id="dbg-body" class="dbg__body"></pre>
  </aside>

  <noscript>
    <p class="noscript">Hace falta JavaScript para oír la radio.</p>
  </noscript>

  <script src="js/player.js?v=7" defer></script>
</body>
</html>
